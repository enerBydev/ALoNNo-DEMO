name: CI en rojo

# UN CI ROTO ES INVISIBLE PARA ClickUp: la tarea sigue «en progreso» aunque el código no
# compile, y un `blocked` invisible es peor que no tenerlo — el tablero afirma algo falso con
# la misma confianza que cuando dice la verdad.
#
# ⚠️ AJUSTA `workflows:` AL NOMBRE REAL DE TU WORKFLOW DE CI. Es el `name:` de su fichero, no
# el nombre del fichero. Si no coincide, esto no se dispara nunca y no avisa de nada: falla en
# silencio, que es la peor forma de fallar. Medido el 2026-09-06 al repartirlo — de cuatro
# repos, uno llamaba al suyo «CI/CD Pipeline» y habría quedado mudo.
#
# Y ESE FILTRO IMPIDE ADEMÁS QUE ESTO SE DISPARE A SÍ MISMO. Sin él, este workflow termina,
# produce su propio `workflow_run` y vuelve a empezar: un bucle que solo se nota en la factura.
#
# VA EN SU PROPIO FICHERO a propósito: `workflow_run` y `pull_request` en el mismo se disparan
# el uno con los eventos del otro y producen runs fantasma que nadie relaciona con su causa.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  bloquear:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    # Un puente de observabilidad que tumba nada deja de ser observabilidad.
    continue-on-error: true
    steps:
      - uses: enerBydev/methodOS/.github/actions/sync-cu@main
        with:
          clickup-token: ${{ secrets.CLICKUP_TOKEN }}
          accion: roto
