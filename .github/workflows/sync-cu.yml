name: sync-cu

# EL PUENTE HACIA ClickUp, en una sola dirección: GitHub → ClickUp. Nunca al revés, y **nunca
# sobre Issues** — ésa es la frontera estéril que hace el bucle imposible por construcción
# (methodOS `docs/contrato-autoridad.md`).
#
# ES EL ÚNICO ESCRITOR DE `done`. Por eso `Closes CU-…` está prohibido en los mensajes de
# commit y lo deniega el hook: funcionaría *además* de esto, y con dos escritores la D1 recibe
# dos transiciones para el mismo hecho — el cycle time deja de medir lo que dice.
#
# SIN `CLICKUP_TOKEN` NO PASA NADA. El repo que no quiera el puente simplemente no pone el
# secreto: la acción informa el hueco y sale limpia, igual que el App revisor. Nada aquí es
# obligatorio para que el gate esté verde.
#
# `continue-on-error` NO ES PEREZA, ES LA DECISIÓN: un puente de observabilidad que tumba
# merges deja de ser observabilidad y pasa a ser un obstáculo, y lo desactivan en una semana.

# EL CIERRE CUELGA DEL PUSH A `main`, NO DEL CIERRE DEL PR — y no es un detalle de estilo.
#
# Medido el 2026-09-06 integrando el PR que trajo este puente: `gh pr merge --delete-branch`
# borra la rama en el mismo acto, y GitHub **cancela los runs en vuelo de una ref que ya no
# existe**. El evento `closed` llega y su run muere antes de hacer nada, así que el job que
# cierra tareas no se ejecutaba nunca — y con `continue-on-error`, sin ruido que lo delatara.
#
# El push a `main` no tiene ese problema, y el id de la tarea viaja en el mensaje del commit de
# squash: `gh` conserva los mensajes originales en el cuerpo, y el hook obliga a que todos
# citen su tarea. Por eso la acción lee el mensaje ENTERO y no solo su primera línea.
on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]

jobs:
  abierto:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: enerBydev/methodOS/.github/actions/sync-cu@main
        with:
          clickup-token: ${{ secrets.CLICKUP_TOKEN }}
          accion: abierto

  integrado:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: enerBydev/methodOS/.github/actions/sync-cu@main
        with:
          clickup-token: ${{ secrets.CLICKUP_TOKEN }}
          accion: integrado
